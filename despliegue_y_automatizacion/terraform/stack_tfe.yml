version: "3.8"

services:
  backend:
    image: bryann444/tfe_backend:latest
    deploy:
      replicas: 2
    environment:
      ConnectionStrings__DefaultConnection: "Server=3.150.38.7,1433;Database=Daños_Dia;User Id=tfe;Password=Bryannsilva21*;Encrypt=False;TrustServerCertificate=True;"
    ports:
      - "5000:80"
    networks:
      - tfe_net

  frontend:
    image: bryann444/tfe_frontend:latest
    deploy:
      replicas: 2
    networks:
      - tfe_net

  balanceador:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - /opt/tfe/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      replicas: 1
    networks:
      - tfe_net

networks:
  tfe_net:
    driver: overlay
